<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Islamic AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        islamic: {
                            dark: '#061a14',
                            card: '#0b2e23',
                            gold: '#d4af37',
                            lightgold: '#f3e5ab'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #061a14; color: #f3f4f6; margin: 0; padding: 0; overflow: hidden; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #d4af3744; border-radius: 9999px; }
    </style>
</head>
<body class="bg-islamic-dark flex flex-col h-[100vh] justify-between">

    <!-- Top Header & Controls -->
    <header class="bg-islamic-card border-b border-islamic-gold/30 px-3 py-2 flex justify-between items-center shrink-0 z-20 shadow-md">
        <div class="flex items-center gap-2">
            <span class="text-islamic-gold font-bold text-xs">Islamic AI Bot</span>
            <button onclick="toggleApiKeyModal()" class="bg-islamic-gold/20 text-islamic-lightgold border border-islamic-gold/40 px-2 py-1 rounded text-[10px] font-semibold">🔑 API Key</button>
        </div>
        <div class="flex items-center gap-1.5">
            <button id="liveVoiceBtn" onclick="toggleLiveVoiceMode()" class="bg-emerald-800/60 text-emerald-200 border border-emerald-500/50 px-2 py-1 rounded text-[10px] font-bold animate-pulse">🎙️ Live: OFF</button>
            <select id="langSelector" class="bg-islamic-dark border border-islamic-gold/40 text-islamic-lightgold text-xs rounded px-1.5 py-1 focus:outline-none">
                <option value="Hindi">हिंदी</option>
                <option value="English">English</option>
                <option value="Roman Urdu">Roman Urdu</option>
                <option value="Roman Hindi">Roman Hindi</option>
            </select>
        </div>
    </header>

    <!-- Chat Stream (Scrollable Area with extra bottom spacing so messages aren't hidden) -->
    <main id="chat-stream" class="flex-1 overflow-y-auto p-3 space-y-3 chat-scroll pb-20">
        <div class="flex items-start gap-2.5">
            <div class="w-7 h-7 rounded-full bg-islamic-gold text-islamic-dark flex items-center justify-center font-bold text-xs shrink-0 shadow">AI</div>
            <div class="bg-islamic-card border border-islamic-gold/30 p-3 rounded-2xl rounded-tl-none max-w-[88%] text-xs md:text-sm text-gray-200 shadow">
                अस्सलामुआलैकुम! ऊपर 🔑 API Key बटन पर क्लिक करके अपनी की दर्ज करें। सर्च बॉक्स अब बिल्कुल ऊपर और सही जगह पर फिक्स कर दिया गया है।
            </div>
        </div>
    </main>

    <!-- Fixed Bottom Input Bar (Properly raised up so it's fully visible on mobile) -->
    <div class="shrink-0 bg-islamic-dark border-t border-islamic-gold/30 p-2.5 z-30 shadow-2xl mb-2">
        <div class="max-w-4xl mx-auto flex items-center gap-2 bg-islamic-card border border-islamic-gold/40 p-1.5 rounded-xl shadow-lg">
            <input type="text" id="userQueryInput" onkeypress="if(event.key==='Enter') submitQuery()" placeholder="अपना प्रश्न यहाँ लिखें..." 
                   class="flex-1 bg-islamic-dark border border-islamic-gold/20 rounded-lg px-3 py-2 text-xs md:text-sm text-gray-100 focus:outline-none focus:ring-1 focus:ring-islamic-gold">
            
            <button id="micBtn" onclick="triggerSingleMic()" class="bg-islamic-dark hover:bg-islamic-gold/20 text-islamic-lightgold border border-islamic-gold/40 p-2 rounded-lg text-xs shrink-0">
                🎙️
            </button>

            <button onclick="submitQuery()" class="bg-islamic-gold hover:bg-islamic-lightgold text-islamic-dark font-bold px-3.5 py-2 rounded-lg text-xs shrink-0">
                भेजें
            </button>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-islamic-card border border-islamic-gold/50 p-4 rounded-2xl max-w-sm w-full space-y-3 shadow-2xl">
            <h3 class="text-islamic-gold font-bold text-xs md:text-sm">अपनी Gemini API Key दर्ज करें</h3>
            <p class="text-[11px] text-gray-300">AI Studio से मिली API Key यहाँ पेस्ट करें:</p>
            <input type="password" id="apiKeyInput" placeholder="AQ..." class="w-full bg-islamic-dark border border-islamic-gold/30 rounded-lg p-2 text-xs text-white focus:outline-none">
            <div class="flex justify-end gap-2">
                <button onclick="toggleApiKeyModal()" class="text-xs text-gray-400 px-3 py-1">रद्द करें</button>
                <button onclick="saveApiKey()" class="bg-islamic-gold text-islamic-dark font-bold text-xs px-4 py-1.5 rounded-lg">सेव करें</button>
            </div>
        </div>
    </div>

    <script>
        let isLiveVoiceActive = false;
        let recognition = null;

        function toggleApiKeyModal() {
            const modal = document.getElementById('apiKeyModal');
            modal.classList.toggle('hidden');
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(!key) { alert('कृपया सही की दर्ज करें'); return; }
            localStorage.setItem('gemini_api_key', key);
            toggleApiKeyModal();
            alert('API Key सफलतापूर्वक सुरक्षित हो गई है!');
        }

        async function submitQuery(customText = null) {
            const input = document.getElementById('userQueryInput');
            const query = customText || input.value.trim();
            if (!query) return;

            if(!customText) input.value = '';

            const selectedLang = document.getElementById('langSelector').value;
            const chatStream = document.getElementById('chat-stream');

            chatStream.insertAdjacentHTML('beforeend', `
                <div class="flex items-start gap-2.5 justify-end">
                    <div class="bg-islamic-gold/20 border border-islamic-gold/40 p-3 rounded-2xl rounded-tr-none max-w-[85%] text-xs md:text-sm text-islamic-lightgold shadow">
                        ${query}
                    </div>
                    <div class="w-7 h-7 rounded-full bg-emerald-800 text-emerald-200 flex items-center justify-center font-bold text-xs shrink-0">👤</div>
                </div>
            `);

            const aiId = 'ai-msg-' + Date.now();
            chatStream.insertAdjacentHTML('beforeend', `
                <div class="flex items-start gap-2.5">
                    <div class="w-7 h-7 rounded-full bg-islamic-gold text-islamic-dark flex items-center justify-center font-bold text-xs shrink-0 shadow">AI</div>
                    <div id="${aiId}" class="bg-islamic-card border border-islamic-gold/30 p-3 rounded-2xl rounded-tl-none max-w-[88%] text-xs md:text-sm text-gray-200 shadow">
                        <span class="animate-pulse text-islamic-gold">इंटरनेट से खोजा जा रहा है...</span>
                    </div>
                </div>
            `);
            chatStream.scrollTop = chatStream.scrollHeight;

            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) {
                document.getElementById(aiId).innerHTML = `<span class="text-red-400">कृपया पहले ऊपर 🔑 API Key बटन पर क्लिक करके अपनी की सेट करें।</span>`;
                return;
            }

            try {
                const promptText = `You are an authentic Islamic AI assistant with live internet access. Answer accurately with Quran and Sahih Hadith evidence. Reply strictly in ${selectedLang}. User Question: ${query}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                const data = await response.json();
                const aiAnswer = data.candidates[0].content.parts[0].text;

                document.getElementById(aiId).innerHTML = `
                    <div class="space-y-2">
                        <p class="leading-relaxed">${aiAnswer.replace(/\n/g, '<br>')}</p>
                        <button onclick="speakText(this)" class="bg-islamic-gold/20 hover:bg-islamic-gold/30 text-islamic-lightgold border border-islamic-gold/30 px-2 py-0.5 rounded text-[10px]">🔊 सुनें</button>
                    </div>
                `;
                chatStream.scrollTop = chatStream.scrollHeight;

                if(isLiveVoiceActive) {
                    speakTextDirect(aiAnswer);
                }
            } catch (err) {
                document.getElementById(aiId).innerHTML = `<span class="text-red-400">कनेक्शन में समस्या आई। अपनी API Key जांचें।</span>`;
            }
        }

        function triggerSingleMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert('आपका ब्राउज़र वॉइस रिकग्निशन सपोर्ट नहीं करता।'); return; }
            const rec = new SpeechRecognition();
            rec.onresult = (e) => {
                document.getElementById('userQueryInput').value = e.results[0][0].transcript;
                submitQuery();
            };
            rec.start();
        }

        function toggleLiveVoiceMode() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert('आपका ब्राउज़र वॉइस सपोर्ट नहीं करता।'); return; }
            const btn = document.getElementById('liveVoiceBtn');

            if(isLiveVoiceActive) {
                isLiveVoiceActive = false;
                if(recognition) recognition.stop();
                btn.innerText = "🎙️ Live: OFF";
                btn.className = "bg-emerald-800/60 text-emerald-200 border border-emerald-500/50 px-2 py-1 rounded text-[10px] font-bold";
            } else {
                isLiveVoiceActive = true;
                btn.innerText = "🎙️ Live: ON (Listening)";
                btn.className = "bg-red-700 text-white border border-red-500 px-2 py-1 rounded text-[10px] font-bold animate-pulse";
                startContinuousListening();
            }
        }

        function startContinuousListening() {
            if(!isLiveVoiceActive) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onresult = (e) => {
                const spokenText = e.results[0][0].transcript;
                submitQuery(spokenText);
            };
            recognition.onend = () => {
                if(isLiveVoiceActive) {
                    setTimeout(() => { recognition.start(); }, 1000);
                }
            };
            try { recognition.start(); } catch(e) {}
        }

        function speakText(btn) {
            window.speechSynthesis.cancel();
            const text = btn.previousElementSibling.innerText;
            const speech = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(speech);
        }

        function speakTextDirect(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, ''));
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
