<!DOCTYPE html>
<html lang="hi" class="dark">
<head>

        tailwind.config = {

            theme: {
                extend: {
                    colors: {
                        islamic: {
                            dark: '#061a14',
                            card: '#0b2e23',
                            gold: '#d4af37',
                            lightgold: '#f3e5ab'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #061a14; color: #f3f4f6; margin: 0; padding: 0; overflow: hidden; }
        .arabic-font { font-family: 'Amiri', serif; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #d4af3744; border-radius: 9999px; }
    </style>
</head>
<body class="bg-islamic-dark flex flex-col h-[100vh] justify-between">

    <!-- Top Header & Live Controls -->
    <header class="bg-islamic-card border-b border-islamic-gold/30 px-3 py-2 flex justify-between items-center shrink-0 z-20 shadow-md">
        <div class="flex items-center gap-1.5">
            <span class="text-islamic-gold font-bold text-xs">AI Mustapha</span>

        <div class="flex items-center gap-1.5">

            <select id="langSelector" class="bg-islamic-dark border border-islamic-gold/40 text-islamic-lightgold text-xs rounded px-1.5 py-1 focus:outline-none">

                <option value="Roman Urdu">Roman Urdu</option>
                <option value="Roman Hindi">Roman Hindi</option>
            </select>

        </div>

            <div class="w-6 h-6 rounded-full bg-islamic-gold text-islamic-dark flex items-center justify-center font-bold text-[10px] shrink-0 shadow">AI</div>
            <div class="bg-islamic-card border border-islamic-gold/30 p-3 rounded-2xl rounded-tl-none max-w-[88%] text-xs text-gray-200 shadow">

            </div>
        </div>
    </main>

            <button onclick="triggerVoiceInput()" class="bg-islamic-dark hover:bg-islamic-gold/20 text-islamic-lightgold border border-islamic-gold/40 p-2 rounded-lg text-xs shrink-0">
                🎙️

                भेजें
            </button>
        </div>
    </div>
